name: Publicar Inventario Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar permisos y consistencia de inventario
        run: npm ci --prefix backend --omit=dev && npm test --prefix backend
      - name: Preparar aplicación y exportación de reportes
        run: |
          npm ci --prefix report-tools
          mkdir public
          cp index.html app.js direct.js consumption.js reports.js team-config.js styles.css manifest.webmanifest icon.svg sw.js public/
          report-tools/node_modules/.bin/esbuild report-tools/export.js --bundle --format=esm --minify --outfile=public/report-vendor.js
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
